<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Каталог единиц — Мера</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">
  <header class="header">
    <div class="container header__content">
      <a class="logo" href="index.html"><svg class="icon" aria-hidden="true"><use href="img/icons.svg#ruler"></use></svg>Мера</a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Открыть меню">
        <span></span><span></span><span></span>
      </button>
      <nav class="navigation" id="main-nav" aria-label="Основная навигация">
        <a href="index.html">Главная</a>
        <a href="catalog.html" aria-current="page">Каталог</a>
        <a href="index.html#about">О проекте</a>
      </nav>
    </div>
  </header>

  <main class="container main">
    <section class="intro">
      <h1>Каталог единиц</h1>
      <p>Найдите нужную единицу измерения по названию, обозначению или категории.</p>
    </section>

    <form class="filters" data-catalog-filters role="search">
      <label class="field">
        <span class="field__label">Поиск по названию или обозначению</span>
        <span class="search">
          <svg class="icon search__icon" aria-hidden="true"><use href="img/icons.svg#search"></use></svg>
          <input class="field__control" type="search" name="q" placeholder="Введите запрос, например, метр…" autocomplete="off">
        </span>
      </label>
      <label class="field">
        <span class="field__label">Категория</span>
        <select class="field__control" name="category" data-category-select>
          <option value="">Все категории</option>
        </select>
      </label>
    </form>

    <p class="catalog-summary" data-catalog-summary aria-live="polite"></p>

    <section class="table-card" aria-label="Единицы измерения">
      <table class="unit-table">
        <thead>
          <tr><th scope="col">Название</th><th scope="col">Обозначение</th><th scope="col">Категория</th><th scope="col">Коэффициент к СИ</th></tr>
        </thead>
        <tbody data-unit-rows></tbody>
      </table>
      <div class="empty-state" data-empty-state hidden>
        <svg class="icon empty-state__icon" aria-hidden="true"><use href="img/icons.svg#search"></use></svg>
        <p class="empty-state__title">Ничего не найдено</p>
        <p>Измените запрос или выберите другую категорию.</p>
        <button class="button button--secondary" type="button" data-reset-filters>Сбросить фильтры</button>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="container">© 2026 Мера — справочник единиц измерения</div></footer>
  <script src="js/units-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
