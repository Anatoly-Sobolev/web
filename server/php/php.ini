; PHP 8.4 для проекта «Мера». extension_dir передаётся скриптом запуска.
[PHP]
engine = On
short_open_tag = Off
expose_php = On
max_execution_time = 30
memory_limit = 128M
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "logs/php-error.log"
default_charset = "UTF-8"
cgi.fix_pathinfo = 0
date.timezone = Asia/Omsk

extension = mbstring
extension = pdo_pgsql
extension = pgsql
