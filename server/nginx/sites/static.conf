# Статическая вёрстка ЛР3 через тот же NGINX: http://static.mera.localhost:8080/
server {
    listen       127.0.0.1:8080;
    server_name  static.mera.localhost;

    root   ../site;
    index  index.html;

    access_log  logs/static.access.log  main;

    location / {
        try_files $uri $uri/ =404;
    }
}
