# Виртуальный хост PHP-приложения (ЛР4–ЛР5): http://mera.localhost:8080/
server {
    listen       127.0.0.1:8080 default_server;
    server_name  mera.localhost localhost;

    # Абсолютный путь к app/public: php-cgi в Windows не принимает пути с "..".
    # Файл создаётся скриптом server/start.ps1 под текущее расположение проекта.
    include  generated/app-root.conf;
    index  index.php;

    access_log  logs/mera.access.log  main;
    error_log   logs/mera.error.log   warn;

    # Общие стили, скрипты и иконки берутся из вёрстки ЛР3 (каталог site/).
    location ~ ^/(css|js|img)/ {
        root     ../site;
        expires  1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Передача PHP-скриптов в PHP по FastCGI (php-cgi на 127.0.0.1:9000).
    location ~ \.php$ {
        try_files      $uri =404;
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    }

    # Запрет доступа к скрытым файлам.
    location ~ /\. {
        deny all;
    }
}
