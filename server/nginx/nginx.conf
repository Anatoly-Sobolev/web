# NGINX для проекта «Мера» (Windows, портативная сборка в server/bin/nginx).
# Запуск из корня проекта: server\bin\nginx\nginx.exe -p server/ -c nginx/nginx.conf
# Относительные пути считаются от префикса server/.

worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types text/css application/javascript image/svg+xml;

    log_format  main  '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent $request_time';
    access_log  logs/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      on;

    include sites/*.conf;
}
