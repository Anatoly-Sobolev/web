# Виртуальный хост «Мера» для docker compose (PHP-FPM в контейнере php:9000).
server {
    listen       80;
    server_name  mera.localhost localhost;
    root   /var/www/app/public;
    index  index.php;
    charset utf-8;

    location ~ ^/(css|js|img)/ {
        root /var/www/site;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files      $uri =404;
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
